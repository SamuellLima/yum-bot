services:
  postgres:
    image: postgres:16-alpine
    container_name: yumbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yumbot
      POSTGRES_USER: yumbot
      POSTGRES_PASSWORD: yourpassword
      TZ: America/Sao_Paulo
    ports:
      - "15432:5432"
    volumes:
      - yumbot_pgdata:/var/lib/postgresql/data

volumes:
  yumbot_pgdata: