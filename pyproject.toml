[project]
name = "yum-bot"
version = "0.0.1"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["App"]
extend-exclude = [".venv", "venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
